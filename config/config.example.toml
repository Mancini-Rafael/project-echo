[openai]
model = "gpt-4o-transcribe"

[transcription]
vocabulary_prompt = """
TypeScript, Python, Postgres, Kubernetes, Docker, Rails, Django, Flask,
React, Next.js, Tailwind, npm, pnpm, uv, async, await, webhook, OAuth
"""
language = "en"

[recording]
sample_rate = 16000
channels = 1

[hotkey]
# Modifier-only chord that toggles recording. All listed keys must be pressed
# simultaneously. Supported modifier names: control, option, command, shift.
# You can also use any printable letter/digit, "space", "f1"-"f12". Modifier
# names match either side (e.g. "control" matches both left and right ctrl).
chord = ["control", "option", "command"]

[hotkey.sounds]
# Paths to sound files (.aiff/.wav). macOS system sounds live in
# /System/Library/Sounds/ (Pop, Tink, Glass, Funk, Bottle, Frog, Hero,
# Morse, Ping, Purr, Sosumi, Submarine). Set to "" to disable a cue.
start = "/System/Library/Sounds/Pop.aiff"
stop = "/System/Library/Sounds/Tink.aiff"
empty = "/System/Library/Sounds/Funk.aiff"
success = "/System/Library/Sounds/Glass.aiff"

[local_whisper]
# Local transcription with whisper.cpp, used by `ec video`.
# Install: brew install whisper-cpp
binary = "whisper-cli"
# Download a ggml model first, e.g.:
#   mkdir -p ~/.local/share/echo/models && curl -L -o ~/.local/share/echo/models/ggml-large-v3-turbo.bin \
#     https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-large-v3-turbo.bin
model_path = "~/.local/share/echo/models/ggml-large-v3-turbo.bin"
# "auto" detects the spoken language; it can misdetect very short clips.
# Use "pt", "en", etc. to pin it. `ec video --language` overrides this.
language = "auto"
